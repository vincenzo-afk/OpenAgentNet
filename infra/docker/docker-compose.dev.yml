version: "3.9"

services:
  postgres:
    # pgvector is required by Alembic migration 016 for semantic memory search.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: openagentnet
      POSTGRES_PASSWORD: openagentnet
      POSTGRES_DB: openagentnet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagentnet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "6222:6222"
      - "7422:7422"
      - "8222:8222"
    environment:
      NATS_SERVER_NAME: oan-dev-nats
      NATS_CLUSTER_NAME: openagentnet-dev
      NATS_CLUSTER_ROUTES: ""
      NATS_LEAFNODES: ""
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - natsdata:/data
      - ../nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://openagentnet:openagentnet@postgres:5432/openagentnet
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      NATS_CLUSTER_NAME: openagentnet-dev
      REGION: local
      REGISTRY_ID: local-registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  redisdata:
  natsdata:
