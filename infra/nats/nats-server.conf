# OpenAgentNet multi-region NATS configuration.
# Set NATS_CLUSTER_NAME and NATS_CLUSTER_ROUTES in the deployment environment.
port: 4222
http: 8222
server_name: $NATS_SERVER_NAME

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 1Gb
  max_file_store: 10Gb
}

cluster {
  name: $NATS_CLUSTER_NAME
  port: 6222
  # NATS_CLUSTER_ROUTES should contain a comma-separated list of nats:// URLs.
  routes: [$NATS_CLUSTER_ROUTES]
  connect_retries: true
}

# A leaf node may bridge independent regional clusters when full clustering is
# not possible. Keep empty by default; set NATS_LEAFNODES in production.
leafnodes {
  port: 7422
  remotes: [$NATS_LEAFNODES]
}
